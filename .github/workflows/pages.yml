name: Pages
# Builds the WebAssembly demo in web/ and deploys web/www to GitHub Pages.
# One-time repo setting: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    # Only when something that goes into the page changes.
    paths: [src/**, web/**, Cargo.toml, Cargo.lock, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    # At job level so rust-cache keys the cache on them.
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      RUSTFLAGS: -C target-feature=+simd128
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Caches the compiled dependencies (zstd-sys's C included) and wasm-pack's downloaded
      # wasm-bindgen and wasm-opt binaries.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
          cache-on-failure: true
          cache-directories: ~/.cache/.wasm-pack
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # zstd-sys compiles C for wasm32 and needs a clang with the WebAssembly backend (the runner
      # image usually has one).
      - run: command -v clang || (sudo apt-get update && sudo apt-get install -y --no-install-recommends clang)
      # wasm-pack runs wasm-opt with the flags in web/Cargo.toml ([package.metadata.wasm-pack]).
      - name: Build
        run: wasm-pack build web --target web --release --no-typescript --no-pack --out-dir www/pkg
      - run: rm -f web/www/pkg/.gitignore && ls -la web/www/pkg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/www

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
