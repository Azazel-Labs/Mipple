name: Release

# After CI passes on a push to main, tag vX.Y.Z and publish a release with binaries. X.Y come from
# Cargo.toml (edit it to change major/minor); Z is the next patch after the highest vX.Y.* tag, or
# the Cargo.toml patch if that is higher. The build stamps that version into Cargo.toml (not
# committed) so `mipple --version` matches the tag. crates.io gets the latest release once a night
# (crates.yml). A commit that already has a tag is skipped, and
# so is one that is no longer the tip of main: the workflow token may not tag an older commit (HTTP
# 403), and the newer commit's own release includes it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: v
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          IFS=. read -r major minor patch <<< "${base%%-*}"
          tags=$(git ls-remote --tags --refs origin 'refs/tags/v*')
          # A re-run of an already released commit publishes nothing.
          skip=false
          if grep -q "^$SHA[[:space:]]refs/tags/v" <<< "$tags"; then skip=true; fi
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$SHA" ]; then skip=true; echo "main has moved on to $tip"; fi
          last=$(sed -n "s|.*refs/tags/v$major\.$minor\.\([0-9][0-9]*\)$|\1|p" <<< "$tags" | sort -n | tail -n1)
          if [ -n "$last" ] && [ $((last + 1)) -gt "$patch" ]; then patch=$((last + 1)); fi
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "version $major.$minor.$patch (Cargo.toml $base, last tag v$major.$minor.${last:-none}), skip=$skip"

  build:
    needs: meta
    if: needs.meta.outputs.skip == 'false'
    strategy:
      matrix:
        include:
          # Oldest supported runner: the binary needs the glibc it was built against or newer.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(name = "mipple"\r?\nversion = )"[^"]*"/$1"$ENV{VERSION}"/' Cargo.lock
          grep -m1 '^version' Cargo.toml
          grep -A1 '^name = "mipple"' Cargo.lock
      - run: cargo build --release --locked --bin mipple --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=mipple-${{ matrix.target }}
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/mipple${{ matrix.ext }}" README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = Windows ]; then 7z a -bd "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: mipple-${{ matrix.target }}
          path: mipple-${{ matrix.target }}.*

  publish:
    needs: [meta, build]
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.meta.outputs.sha }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum mipple-* > SHA256SUMS
      # Checked again here: main can move on while the binaries build.
      - name: Still the tip of main?
        id: tip
        run: |
          tip=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "main has moved on to $tip; its release covers $SHA"; fi
      - name: Release
        if: steps.tip.outputs.go == 'true'
        run: gh release create "v$VERSION" dist/* --target "$SHA" --title "mipple $VERSION" --generate-notes
